name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "scripts/landing-release.mjs"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Update published installer links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" | node scripts/landing-release.mjs
      - name: Build static page
        run: pnpm exec vite build --config landing/vite.config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
